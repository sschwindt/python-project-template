name: ci

on:
  push:
  pull_request:

jobs:
  # Fast feedback on every push: style + tests that don't need GDAL.
  lint-and-light-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install package with dev tools (no geospatial stack)
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Lint and check formatting
        run: |
          ruff check .
          ruff format --check .
      - name: Light tests
        run: pytest -m "not heavy"

  # Full test suite in the real conda environment, including GDAL/rasterio.
  full-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v7
      - uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: environment.yml
          cache-environment: true
      - name: All tests (including heavy)
        run: pytest

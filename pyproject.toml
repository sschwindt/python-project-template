[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "wrr"
version = "0.0.1"
description = "WRR geodata project starter"
readme = "README.md"
requires-python = ">=3.14"
authors = [{ name = "Your Name", email = "you@example.com" }]
# Runtime dependencies are intentionally NOT listed here: the heavy geospatial
# stack (GDAL, rasterio, ...) comes from conda-forge via environment.yml.
dependencies = []

[project.optional-dependencies]
# Light tools only, so CI can `pip install -e .[dev]` without the geo stack.
# numpy is needed by the light tests (standard_step.py). Keep the ruff version
# in sync with environment.yml and .pre-commit-config.yaml.
dev = ["numpy", "pytest", "ruff>=0.16,<0.17", "pre-commit"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["wrr*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "heavy: needs the full geospatial stack (GDAL/rasterio); skipped in light CI",
]
